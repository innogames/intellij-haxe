name: Release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # create GitHub Releases
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew clean buildPlugin --no-daemon

      - name: Identify built artifact
        id: artifact
        run: |
          ZIP_PATH=$(ls intellij-haxe*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_PATH" ]; then
            echo "::error::No intellij-haxe*.zip produced at project root"
            exit 1
          fi
          echo "zip_path=$ZIP_PATH"               >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}"     >> "$GITHUB_OUTPUT"

      - name: Extract IDE compatibility from patched plugin.xml
        id: compat
        run: |
          PLUGIN_XML=build/tmp/patchPluginXml/plugin.xml
          if [ ! -f "$PLUGIN_XML" ]; then
            echo "::error::plugin.xml not found in build/ — patchPluginXml may not have run"
            exit 1
          fi
          SINCE=$(sed -nE 's/.*since-build="([^"]+)".*/\1/p' "$PLUGIN_XML" | head -1)
          # until-build is optional: releases may ship with no upper compatibility bound.
          UNTIL=$(sed -nE 's/.*until-build="([^"]+)".*/\1/p' "$PLUGIN_XML" | head -1)
          if [ -z "$SINCE" ]; then
            echo "::error::Could not parse since-build from $PLUGIN_XML"
            cat "$PLUGIN_XML"
            exit 1
          fi
          PLUGIN_ID=$(sed -nE 's|.*<id>([^<]+)</id>.*|\1|p' "$PLUGIN_XML" | head -1)
          PLUGIN_NAME=$(sed -nE 's|.*<name>([^<]+)</name>.*|\1|p' "$PLUGIN_XML" | head -1)
          PLUGIN_VERSION=$(sed -nE 's|.*<version>([^<]+)</version>.*|\1|p' "$PLUGIN_XML" | head -1)
          if [ "$PLUGIN_VERSION" != "${{ steps.artifact.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pluginVersion $PLUGIN_VERSION in gradle.properties"
            exit 1
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"
          echo "id=$PLUGIN_ID" >> "$GITHUB_OUTPUT"
          echo "name=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.zip_path }}
          generate_release_notes: true

      - name: Generate updatePlugins.xml
        run: |
          mkdir -p public
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.artifact.outputs.zip_name }}"
          # Only emit until-build when the build actually set an upper bound.
          UNTIL_ATTR=""
          if [ -n "${{ steps.compat.outputs.until }}" ]; then
            UNTIL_ATTR=" until-build=\"${{ steps.compat.outputs.until }}\""
          fi
          cat > public/updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin
              id="${{ steps.compat.outputs.id }}"
              url="${DOWNLOAD_URL}"
              version="${{ steps.artifact.outputs.version }}">
              <idea-version since-build="${{ steps.compat.outputs.since }}"${UNTIL_ATTR}/>
              <name>${{ steps.compat.outputs.name }}</name>
              <vendor>${GITHUB_REPOSITORY_OWNER}</vendor>
              <description><![CDATA[Custom fork of the Haxe IntelliJ plugin.]]></description>
              <change-notes><![CDATA[Built from ${GITHUB_SHA} by ${GITHUB_WORKFLOW} run #${GITHUB_RUN_NUMBER}.]]></change-notes>
            </plugin>
          </plugins>
          EOF
          echo "Generated descriptor:"
          cat public/updatePlugins.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
